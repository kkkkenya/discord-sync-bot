<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ESH Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Instrument+Serif&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f7f4;--card:#fff;--ink:#141417;--dim:#61616d;--line:#e3e3ea;--acc:#5865F2;--acc-ink:#fff;--ok:#1f8a4c;--warn:#b26b00;--bad:#c23b3b;--chip:#eef0ff}
:root:not([data-theme="light"]){color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0d10;--card:#16161b;--ink:#f1f1f4;--dim:#a4a4b0;--line:#2a2a33;--chip:#23264a;--ok:#42c27a;--warn:#e0a03a;--bad:#ef6b6b}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:15px/1.5 Figtree,system-ui,sans-serif}
button,input{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:12px;padding-bottom:12px}
.brand{font-family:'Instrument Serif',Georgia,serif;font-size:24px}
.who{font-size:13px;color:var(--dim)}.who a{color:var(--dim)}
.tabs{display:flex;gap:6px;margin:16px 0}
.tab{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:600}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fname{font-weight:700;word-break:break-word}.meta{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--dim)}
.reason{display:inline-block;font-size:12.5px;background:var(--chip);border-radius:8px;padding:2px 8px;margin:6px 0}
.snippet{font-size:13.5px;color:var(--dim);margin:4px 0 0;max-height:4.5em;overflow:hidden}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:600}
.btn--primary{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn:disabled{opacity:.5;cursor:default}
.picker{position:relative;flex:1;min-width:220px}
.picker input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px}
.sugg{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.18);max-height:280px;overflow:auto;z-index:4}
.sugg button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;cursor:pointer}
.sugg button:hover,.sugg button.on{background:var(--chip)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{background:var(--chip);border-radius:999px;padding:3px 10px;font-size:13px}.chip b{cursor:pointer;margin-left:6px}
.preview{margin-top:10px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.preview iframe{width:100%;height:70vh;border:0;background:#fff}.preview img{max-width:100%;display:block}
.bulk{position:sticky;top:62px;z-index:3;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px;margin-bottom:12px}
.bulk .picker input{background:var(--card);color:var(--ink)}
.msg{font-size:13.5px;margin-top:8px}.msg.ok{color:var(--ok)}.msg.err{color:var(--bad)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.tile .n{font-family:'Instrument Serif',Georgia,serif;font-size:34px;line-height:1}.tile .l{font-size:12.5px;color:var(--dim);margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}th{color:var(--dim);font-weight:600;font-size:12.5px}
.empty{text-align:center;color:var(--dim);padding:40px 10px}
.signin{max-width:420px;margin:18vh auto;text-align:center}
h2{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:28px;margin:18px 0 8px}
.status-approved{color:var(--ok)}.status-pending{color:var(--warn)}.status-rejected{color:var(--bad)}
</style>
</head>
<body>
<header><div class="wrap"><span class="brand">ESH Admin</span><span class="who" id="who"></span></div></header>
<main class="wrap" id="app"><p class="empty">Loading…</p></main>

<script>
(function () {
  'use strict';
  var app = document.getElementById('app');
  var who = document.getElementById('who');
  var state = { tab: 'sort', queue: [], targets: null, selected: new Set(), chosen: {}, bulkChosen: [] };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var mb = function (b) { return (b / 1048576).toFixed(1) + ' MB'; };
  var day = function (iso) { return new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }); };

  function get(op) {
    return fetch('/api/dash?op=' + op, { credentials: 'same-origin' }).then(function (r) {
      if (r.status === 401) throw new Error('signed-out');
      return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || 'Something went wrong'); return j; });
    });
  }

  function signIn() {
    who.textContent = '';
    app.innerHTML = '<div class="signin card"><h2>Staff sign-in</h2><p class="meta">For Engineering Study Hub admins only.</p><p><a class="btn btn--primary" href="/auth/login" style="display:inline-block;text-decoration:none">Sign in with Discord</a></p></div>';
  }

  // ── destination picker ──
  function options() {
    var t = state.targets; if (!t) return [];
    return t.units.map(function (u) { return { kind: 'unit', code: u.code, label: u.label }; })
      .concat(t.shelves.map(function (s) { return { kind: 'shelf', id: s.id, label: '📚 ' + s.name }; }))
      .concat([{ kind: 'library', label: '📚 #pdf-library (general)' }]);
  }
  function match(q) {
    q = q.trim().toLowerCase(); if (!q) return [];
    var squash = q.replace(/\s+/g, '');
    var words = q.split(/\s+/);
    return options().filter(function (o) {
      var l = o.label.toLowerCase();
      return l.replace(/\s+/g, '').indexOf(squash) !== -1 || words.every(function (w) { return l.indexOf(w) !== -1; });
    }).slice(0, 8);
  }
  function picker(chosen, onChange) {
    var box = document.createElement('div'); box.className = 'picker';
    box.innerHTML = '<input type="text" placeholder="Unit code, title or shelf, e.g. thermo, EMM 305, books" autocomplete="off"><div class="sugg" hidden></div><div class="chips"></div>';
    var input = box.querySelector('input'), sugg = box.querySelector('.sugg'), chips = box.querySelector('.chips');
    var hits = [], on = 0;
    function drawChips() {
      chips.innerHTML = chosen.map(function (c, i) { return '<span class="chip">' + esc(c.label) + '<b data-i="' + i + '" title="Remove">×</b></span>'; }).join('');
      onChange();
    }
    function drawSugg() {
      if (!hits.length) { sugg.hidden = true; return; }
      sugg.hidden = false;
      sugg.innerHTML = hits.map(function (h, i) { return '<button type="button" data-i="' + i + '" class="' + (i === on ? 'on' : '') + '">' + esc(h.label) + '</button>'; }).join('');
    }
    function add(h) {
      if (!chosen.some(function (c) { return c.label === h.label; })) chosen.push(h);
      input.value = ''; hits = []; drawSugg(); drawChips(); input.focus();
    }
    input.addEventListener('input', function () { hits = match(input.value); on = 0; drawSugg(); });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown') { on = Math.min(on + 1, hits.length - 1); drawSugg(); e.preventDefault(); }
      else if (e.key === 'ArrowUp') { on = Math.max(on - 1, 0); drawSugg(); e.preventDefault(); }
      else if (e.key === 'Enter' && hits[on]) { add(hits[on]); e.preventDefault(); }
      else if (e.key === 'Escape') { hits = []; drawSugg(); }
    });
    input.addEventListener('blur', function () { setTimeout(function () { hits = []; drawSugg(); }, 150); });
    sugg.addEventListener('mousedown', function (e) { var b = e.target.closest('button'); if (b) { e.preventDefault(); add(hits[+b.dataset.i]); } });
    chips.addEventListener('click', function (e) { var b = e.target.closest('b'); if (b) { chosen.splice(+b.dataset.i, 1); drawChips(); } });
    drawChips();
    return box;
  }

  function send(item, chosen) {
    return fetch('/api/dash?op=sort', {
      method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ fileMsgId: item.fileMsgId, noteMsgId: item.noteMsgId, targets: chosen.map(function (c) { return { kind: c.kind, code: c.code, id: c.id }; }) }),
    }).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || 'Failed'); return j; }); });
  }

  // ── To sort ──
  function drawSort() {
    var q = state.queue;
    var view = app.querySelector('#view');
    if (!q.length) { view.innerHTML = '<p class="empty">Nothing to sort. Every file the bot received found its unit.</p>'; return; }
    view.innerHTML = '';
    var bulk = document.createElement('div'); bulk.className = 'bulk'; bulk.hidden = true;
    bulk.innerHTML = '<div class="row"><b id="bulkCount"></b><span style="flex:1"></span><button class="btn btn--primary" id="bulkSend" disabled>Send selected</button></div>';
    bulk.appendChild(picker(state.bulkChosen, function () { bulk.querySelector('#bulkSend').disabled = !state.bulkChosen.length; }));
    view.appendChild(bulk);
    function refreshBulk() { bulk.hidden = !state.selected.size; bulk.querySelector('#bulkCount').textContent = state.selected.size + ' selected'; }
    bulk.querySelector('#bulkSend').addEventListener('click', function () {
      var items = q.filter(function (it) { return state.selected.has(it.fileMsgId); });
      var btn = this; btn.disabled = true; btn.textContent = 'Sending…';
      items.reduce(function (p, it) { return p.then(function () { return send(it, state.bulkChosen).then(function () { markDone(it, 'Sent to ' + state.bulkChosen.map(function (c) { return c.label; }).join(', ')); }); }); }, Promise.resolve())
        .catch(function (e) { alert(e.message); })
        .then(function () { btn.textContent = 'Send selected'; state.selected.clear(); refreshBulk(); });
    });

    q.forEach(function (it) {
      var card = document.createElement('div'); card.className = 'card'; card.id = 'f-' + it.fileMsgId;
      var isPdf = /pdf/.test(it.type) || /\.pdf$/i.test(it.name), isImg = /^image\//.test(it.type);
      card.innerHTML =
        '<div class="row"><input type="checkbox" aria-label="Select"><span class="fname">' + esc(it.name) + '</span></div>' +
        '<div class="meta">' + mb(it.size) + ' · ' + day(it.at) + '</div>' +
        (it.reason ? '<div class="reason">' + esc(it.reason) + '</div>' : '') +
        (it.snippet ? '<p class="snippet">“' + esc(it.snippet) + '”</p>' : '') +
        '<div class="row" style="margin-top:10px"><button class="btn" data-act="preview">Preview</button><a class="btn" href="' + esc(it.url) + '" target="_blank" rel="noopener" style="text-decoration:none">Open</a></div>' +
        '<div class="row" style="margin-top:10px;align-items:flex-start"><span class="slot" style="flex:1;min-width:220px"></span><button class="btn btn--primary" data-act="send" disabled>Send</button></div>' +
        '<div class="msg"></div><div class="preview" hidden></div>';
      var chosen = (state.chosen[it.fileMsgId] = state.chosen[it.fileMsgId] || []);
      var sendBtn = card.querySelector('[data-act=send]');
      var pick = picker(chosen, function () { sendBtn.disabled = !chosen.length; });
      card.querySelector('.slot').appendChild(pick);
      // a title match on page 1 is offered as a one-tap suggestion (it's right about half the time)
      var hint = it.suggestion && options().find(function (o) { return o.kind === 'unit' && o.label.indexOf(it.suggestion) === 0; });
      if (hint) {
        var use = document.createElement('button'); use.className = 'btn'; use.style.marginTop = '8px';
        use.textContent = '💡 Use suggestion: ' + hint.label;
        use.addEventListener('click', function () {
          if (!chosen.some(function (c) { return c.label === hint.label; })) chosen.push(hint);
          var input = pick.querySelector('input'); input.dispatchEvent(new Event('input'));
          pick.querySelector('.chips').innerHTML = chosen.map(function (c, i) { return '<span class="chip">' + esc(c.label) + '<b data-i="' + i + '" title="Remove">×</b></span>'; }).join('');
          sendBtn.disabled = false; use.remove();
        });
        card.querySelector('.slot').appendChild(use);
      }
      card.querySelector('input[type=checkbox]').addEventListener('change', function () { if (this.checked) state.selected.add(it.fileMsgId); else state.selected.delete(it.fileMsgId); refreshBulk(); });
      card.querySelector('[data-act=preview]').addEventListener('click', function () {
        var p = card.querySelector('.preview');
        if (!p.hidden) { p.hidden = true; p.innerHTML = ''; return; }
        p.hidden = false;
        p.innerHTML = isImg ? '<img src="' + esc(it.url) + '" alt="">' : isPdf ? '<iframe src="' + esc(it.url) + '" title="Preview"></iframe>' : '<p class="empty">No preview for this file type. Use Open.</p>';
      });
      sendBtn.addEventListener('click', function () {
        var msg = card.querySelector('.msg'); sendBtn.disabled = true; sendBtn.textContent = 'Sending…';
        send(it, chosen).then(function (r) { markDone(it, 'Sent to ' + r.sortedInto.join(', ')); })
          .catch(function (e) { msg.className = 'msg err'; msg.textContent = e.message; sendBtn.disabled = false; sendBtn.textContent = 'Send'; });
      });
      view.appendChild(card);
    });
  }
  function markDone(it, text) {
    var card = document.getElementById('f-' + it.fileMsgId); if (!card) return;
    card.innerHTML = '<span class="fname">' + esc(it.name) + '</span><div class="msg ok">✓ ' + esc(text) + '</div>';
    state.queue = state.queue.filter(function (x) { return x !== it; });
    var t = document.querySelector('[data-tab=sort]'); if (t) t.textContent = 'To sort (' + state.queue.length + ')';
  }

  // ── Stats ──
  function drawStats(s) {
    var view = app.querySelector('#view');
    var tile = function (n, l) { return '<div class="tile"><div class="n">' + esc(n) + '</div><div class="l">' + esc(l) + '</div></div>'; };
    view.innerHTML =
      '<div class="tiles">' +
      tile(s.members, 'Members') + tile(s.joinedLast7Days, 'Joined in the last 7 days') + tile(s.trial, 'On free trial') +
      tile(s.paid, 'Paid (Basic)') + tile(s.premium, 'Premium') + tile(s.payments.pending, 'Payments to approve') +
      tile(s.payments.approvedThisSemester, 'Payments this semester') + tile('KES ' + s.payments.revenueThisSemester.toLocaleString('en'), 'Money this semester') +
      tile(s.toSort, 'Files to sort') + '</div>' +
      '<div class="card"><h2>Trials ending in the next 7 days (' + s.trialsEnding.length + ')</h2>' +
      (s.trialsEnding.length ? '<table><tr><th>Member</th><th>Ends</th></tr>' + s.trialsEnding.slice(0, 40).map(function (t) { return '<tr><td>' + esc(t.name) + '</td><td>' + day(t.ends) + '</td></tr>'; }).join('') + '</table>' + (s.trialsEnding.length > 40 ? '<p class="meta">…and ' + (s.trialsEnding.length - 40) + ' more</p>' : '') : '<p class="meta">None this week.</p>') + '</div>' +
      '<div class="card"><h2>Recent payments</h2>' +
      (s.payments.recent.length ? '<table><tr><th>Who</th><th>Plan</th><th>Status</th><th>Date</th></tr>' + s.payments.recent.map(function (p) { return '<tr><td>' + esc(p.who) + '</td><td>' + esc(p.plan) + '</td><td class="status-' + p.status + '">' + esc(p.status) + '</td><td>' + esc(p.date) + '</td></tr>'; }).join('') + '</table>' : '<p class="meta">No payments yet.</p>') +
      '<p class="meta">Approve or reject payments in #payments on Discord.</p></div>';
  }

  function shell() {
    app.innerHTML = '<div class="tabs" role="tablist"><button class="tab" data-tab="sort" role="tab"></button><button class="tab" data-tab="stats" role="tab">Stats</button></div><div id="view"><p class="empty">Loading…</p></div>';
    app.querySelector('[data-tab=sort]').textContent = 'To sort (' + state.queue.length + ')';
    app.querySelectorAll('.tab').forEach(function (b) { b.addEventListener('click', function () { show(b.dataset.tab); }); });
  }
  function show(tab) {
    state.tab = tab;
    try { localStorage.setItem('esh-tab', tab); } catch (e) {}
    app.querySelectorAll('.tab').forEach(function (b) { b.setAttribute('aria-selected', b.dataset.tab === tab); });
    var view = app.querySelector('#view'); view.innerHTML = '<p class="empty">Loading…</p>';
    if (tab === 'sort') drawSort();
    else get('stats').then(drawStats).catch(function (e) { view.innerHTML = '<p class="empty">' + esc(e.message) + '</p>'; });
  }

  get('me').then(function (me) {
    who.innerHTML = esc(me.name) + ' · <a href="/auth/logout">Sign out</a>';
    return Promise.all([get('queue'), get('targets')]);
  }).then(function (r) {
    state.queue = r[0]; state.targets = r[1];
    shell();
    var saved = 'sort'; try { saved = localStorage.getItem('esh-tab') || 'sort'; } catch (e) {}
    show(saved);
  }).catch(function (e) {
    if (e.message === 'signed-out') signIn();
    else app.innerHTML = '<p class="empty">' + esc(e.message) + '</p>';
  });
})();
</script>
</body>
</html>
